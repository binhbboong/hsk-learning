name: Nhắc tiến độ học HSK mỗi 30 phút

on:
  schedule:
    # GitHub Actions dùng UTC: phút 10 và 40, từ 12:10–16:40,
    # tương ứng 19:10–23:40 Việt Nam.
    - cron: "10,40 12-16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-reminder-v2
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi bot nhắc tiến độ
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            https://hsk-learning-api.vercel.app/api/cron/learning-reminder
