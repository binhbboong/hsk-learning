name: Nhắc tiến độ học HSK

on:
  schedule:
    # GitHub Actions dùng UTC: 12:10–16:10 tương ứng 19:10–23:10 Việt Nam.
    - cron: "10 12-16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi bot nhắc tiến độ
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            https://hsk-learning-api.vercel.app/api/cron/learning-reminder
