name: Nhắc tiến độ học HSK

on:
  schedule:
    # GitHub Actions dùng UTC: 11:30–16:30 tương ứng 18:30–23:30 Việt Nam.
    - cron: "30 11-16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi bot nhắc tiến độ
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            https://hsk-learning-api.vercel.app/api/cron/learning-reminder
