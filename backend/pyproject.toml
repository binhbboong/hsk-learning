[project]
name = "hsk-learning-api"
version = "0.1.0"
description = "FastAPI backend for HSK Learning"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.117.1,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "openai>=1.109,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "truststore>=0.10,<1.0",
  "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<10.0",
  "pytest-asyncio>=1.1,<2.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "hsk_api.main:app"
